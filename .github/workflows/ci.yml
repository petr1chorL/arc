name: CI

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:
    branches: [master, main, codex/harness-governance]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      identity-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: arc_identity_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d arc_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -e "apps/api[test]"

      - name: Run frontend tests
        run: |
          for shard in {1..8}; do
            npm test -- --run --maxWorkers=1 --no-file-parallelism --shard="${shard}/8"
          done

      - name: Run backend tests
        run: python -m pytest apps/api/tests -q

      - name: Verify isolated PostgreSQL identity contracts
        run: node --experimental-transform-types scripts/test-identity-postgres.mjs

      - name: Validate production entrypoint syntax
        run: sh -n scripts/start-production.sh

      - name: Run lint
        run: npm run lint

      - name: Verify deployment configuration
        run: npm run deploy:check

      - name: Build frontend
        run: npm run build
