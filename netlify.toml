[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Identity and Workspace endpoints are migrated one by one. Keep this list
# explicit so unported routes below /api/workspaces still reach Zeabur.
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/identity-workspace?route=/api/auth/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/identity-workspace?route=/api/auth/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/identity-workspace?route=/api/auth/logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/change-password"
  to = "/.netlify/functions/identity-workspace?route=/api/auth/change-password"
  status = 200
  force = true

[[redirects]]
  from = "/api/invitations/:token/activate"
  to = "/.netlify/functions/identity-workspace?route=/api/invitations/:token/activate"
  status = 200
  force = true

[[redirects]]
  from = "/api/invitations/:token"
  to = "/.netlify/functions/identity-workspace?route=/api/invitations/:token"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/audit-events"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/audit-events"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/permissions/matrix"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/permissions/matrix"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/invitations/:invitationId/copy"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/invitations/:invitationId/copy"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/invitations/:invitationId/resend"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/invitations/:invitationId/resend"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/invitations/:invitationId/revoke"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/invitations/:invitationId/revoke"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/invitations"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/invitations"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:userId/user/disable"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members/:userId/user/disable"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:userId/user/enable"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members/:userId/user/enable"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:userId/reviewer"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members/:userId/reviewer"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:userId/disable"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members/:userId/disable"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:userId/enable"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members/:userId/enable"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:userId"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members/:userId"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId/members"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId/members"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces/:workspaceId"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces/:workspaceId"
  status = 200
  force = true

[[redirects]]
  from = "/api/workspaces"
  to = "/.netlify/functions/identity-workspace?route=/api/workspaces"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://arc-v1-lite-lindabaoz.zeabur.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
